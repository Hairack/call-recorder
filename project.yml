name: CallRecorder
options:
  bundleIdPrefix: com.mosdomice
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true
  objectVersion: 56

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  CallRecorder:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mosdomice.callrecord
        PRODUCT_NAME: CallRecorder
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: "Диктофон разговоров"
        CFBundleName: "CallRecorder"
        CFBundleShortVersionString: "1.3"
        CFBundleVersion: "4"
        NSMicrophoneUsageDescription: "Микрофон нужен, чтобы записывать разговоры по громкой связи."
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        # Фоновая запись: без этого iOS останавливает запись, когда
        # приложение свёрнуто или экран заблокирован.
        UIBackgroundModes:
          - audio
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

schemes:
  CallRecorder:
    build:
      targets:
        CallRecorder: all
    run:
      config: Debug
    archive:
      config: Release
